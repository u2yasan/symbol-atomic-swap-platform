name: Symbol Platform Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_DB: drupal
  POSTGRES_USER: drupal
  POSTGRES_PASSWORD: drupal
  SYMBOL_ENGINE_API_TOKEN: 0123456789abcdef0123456789abcdef
  SYMBOL_ENGINE_DATABASE_URL: postgresql://drupal:drupal@postgres:5432/drupal
  SYMBOL_ENGINE_LISTENER_ENABLED: "false"
  SYMBOL_ENGINE_RECONCILER_ENABLED: "false"
  SYMBOL_NETWORK: testnet

jobs:
  test:
    name: Engine and Drupal tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check sensitive file policy
        run: make check-sensitive-files

      - name: Check Node dependency policy
        run: make check-node-dependency-policy

      - name: Install Drupal dependencies
        run: docker run --rm -v "$PWD/drupal:/app" -w /app composer:2 composer install --no-interaction --prefer-dist --no-progress --ignore-platform-req=ext-gd

      - name: Audit Drupal dependencies
        run: make audit-drupal-dependencies

      - name: Build containers
        run: docker compose build

      - name: Install Symbol Engine dependencies in mounted volume
        run: docker compose run --rm --no-deps symbol-engine npm ci

      - name: Start infrastructure
        run: docker compose up -d postgres redis

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Start app services
        run: docker compose up -d symbol-engine drupal

      - name: Wait for Symbol Engine
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs symbol-engine
          exit 1

      - name: Wait for Drupal
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/symbol-atomic-swap/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs drupal
          exit 1

      - name: Audit Symbol Engine production dependencies
        run: docker compose exec -T symbol-engine npm audit --omit=dev

      - name: Typecheck Symbol Engine
        run: docker compose exec -T symbol-engine npm run typecheck

      - name: Build Symbol Engine
        run: docker compose exec -T symbol-engine npm run build

      - name: Build Symbol Engine production image
        run: make build-symbol-engine-production

      - name: Smoke test Symbol Engine production image
        run: make smoke-symbol-engine-production

      - name: Run test suite
        run: make test

      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop stack
        if: always()
        run: docker compose down -v
