symbol_login.login:
  path: '/symbol/login'
  defaults:
    _form: '\Drupal\symbol_login\Form\SymbolLoginForm'
    _title: 'Symbol login'
  requirements:
    _user_is_logged_in: 'FALSE'

symbol_login.login_sss:
  path: '/symbol/login/sss'
  defaults:
    _form: '\Drupal\symbol_login\Form\SymbolLoginForm'
    _title: 'Symbol login with SSS'
    provider: 'sss'
  requirements:
    _user_is_logged_in: 'FALSE'

symbol_login.login_alice:
  path: '/symbol/login/alice'
  defaults:
    _form: '\Drupal\symbol_login\Form\SymbolLoginForm'
    _title: 'Symbol login with aLice'
    provider: 'alice'
  requirements:
    _user_is_logged_in: 'FALSE'

symbol_login.challenge:
  path: '/symbol/login/challenge'
  defaults:
    _controller: '\Drupal\symbol_login\Controller\SymbolLoginController::challenge'
  methods: [POST]
  requirements:
    _user_is_logged_in: 'FALSE'

symbol_login.verify:
  path: '/symbol/login/verify'
  defaults:
    _controller: '\Drupal\symbol_login\Controller\SymbolLoginController::verify'
  methods: [POST]
  requirements:
    _user_is_logged_in: 'FALSE'

symbol_login.sss_challenge:
  path: '/symbol/login/sss/challenge'
  defaults:
    _controller: '\Drupal\symbol_login\Controller\SymbolLoginController::sssChallenge'
  methods: [POST]
  requirements:
    _user_is_logged_in: 'FALSE'

symbol_login.sss_verify:
  path: '/symbol/login/sss/verify'
  defaults:
    _controller: '\Drupal\symbol_login\Controller\SymbolLoginController::sssVerify'
  methods: [POST]
  requirements:
    _user_is_logged_in: 'FALSE'

symbol_login.account:
  path: '/symbol/account'
  defaults:
    _form: '\Drupal\symbol_login\Form\SymbolAccountForm'
    _title: 'My Symbol Account'
  requirements:
    _user_is_logged_in: 'TRUE'

symbol_login.settings:
  path: '/admin/config/people/symbol-login'
  defaults:
    _form: '\Drupal\symbol_login\Form\SymbolLoginSettingsForm'
    _title: 'Symbol login'
  requirements:
    _permission: 'administer symbol login'
