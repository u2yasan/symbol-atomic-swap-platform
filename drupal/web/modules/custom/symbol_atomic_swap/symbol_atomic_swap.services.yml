services:
  symbol_atomic_swap.offer_repository:
    class: Drupal\symbol_atomic_swap\Repository\SwapOfferRepository
    arguments: ['@database']

  symbol_atomic_swap.offer_cosignature_repository:
    class: Drupal\symbol_atomic_swap\Repository\SwapOfferCosignatureRepository
    arguments: ['@database', '@datetime.time']

  symbol_atomic_swap.offer_notification_repository:
    class: Drupal\symbol_atomic_swap\Repository\SwapOfferNotificationRepository
    arguments: ['@database', '@datetime.time', '@symbol_atomic_swap.offer_notification_webhook_notifier', '@symbol_atomic_swap.offer_notification_email_notifier']

  symbol_atomic_swap.offer_notification_webhook_notifier:
    class: Drupal\symbol_atomic_swap\Service\SwapOfferNotificationWebhookNotifier
    arguments: ['@http_client', '@logger.factory', '@config.factory']

  symbol_atomic_swap.offer_notification_email_notifier:
    class: Drupal\symbol_atomic_swap\Service\SwapOfferNotificationEmailNotifier
    arguments: ['@plugin.manager.mail', '@language_manager', '@logger.factory', '@config.factory']

  symbol_atomic_swap.offer_projection_synchronizer:
    class: Drupal\symbol_atomic_swap\Service\SwapOfferProjectionSynchronizer
    arguments: ['@symbol_atomic_swap.offer_repository', '@symbol_engine.client', '@symbol_atomic_swap.offer_notification_repository']

  symbol_atomic_swap.offer_expiration_manager:
    class: Drupal\symbol_atomic_swap\Service\SwapOfferExpirationManager
    arguments: ['@symbol_atomic_swap.offer_repository', '@datetime.time', '@logger.factory', '@symbol_atomic_swap.offer_notification_repository']

  symbol_atomic_swap.offer_access_check:
    class: Drupal\symbol_atomic_swap\Access\SwapOfferAccessCheck
    arguments: ['@symbol_atomic_swap.offer_repository', '@entity_type.manager']
    tags:
      - { name: access_check, applies_to: _symbol_atomic_swap_offer_access }

  symbol_atomic_swap.notification_access_check:
    class: Drupal\symbol_atomic_swap\Access\SwapNotificationAccessCheck
    arguments: ['@symbol_atomic_swap.offer_notification_repository']
    tags:
      - { name: access_check, applies_to: _symbol_atomic_swap_notification_access }
