symbol_atomic_swap.health:
  path: '/symbol-atomic-swap/health'
  defaults:
    _controller: '\Drupal\symbol_atomic_swap\Controller\HealthController::health'
    _title: 'Symbol Atomic Swap Health'
  requirements:
    _permission: 'access content'

symbol_atomic_swap.offer_list:
  path: '/symbol-atomic-swap/offers'
  defaults:
    _controller: '\Drupal\symbol_atomic_swap\Controller\SwapOfferController::list'
    _title: 'Swap Offers'
  requirements:
    _permission: 'view symbol atomic swap offers'

symbol_atomic_swap.offer_add:
  path: '/symbol-atomic-swap/offers/add'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\SwapOfferForm'
    _title: 'Create Swap Offer'
  requirements:
    _permission: 'create symbol atomic swap offers'

symbol_atomic_swap.offer_view:
  path: '/symbol-atomic-swap/offers/{offerId}'
  defaults:
    _controller: '\Drupal\symbol_atomic_swap\Controller\SwapOfferController::view'
    _title_callback: '\Drupal\symbol_atomic_swap\Controller\SwapOfferController::title'
  requirements:
    _symbol_atomic_swap_offer_access: 'view'
    offerId: '\d+'

symbol_atomic_swap.offer_qr_payload:
  path: '/symbol-atomic-swap/offers/{offerId}/qr-payload/{intentHash}'
  defaults:
    _controller: '\Drupal\symbol_atomic_swap\Controller\SwapOfferController::qrPayload'
    _title_callback: '\Drupal\symbol_atomic_swap\Controller\SwapOfferController::qrPayloadTitle'
  requirements:
    _access: 'TRUE'
    offerId: '\d+'
    intentHash: '[0-9A-Fa-f]{64}'

symbol_atomic_swap.address_from_public_key:
  path: '/symbol-atomic-swap/address/{network}/{publicKey}'
  defaults:
    _controller: '\Drupal\symbol_atomic_swap\Controller\SwapOfferController::addressFromPublicKey'
    _title: 'Symbol address'
  requirements:
    _permission: 'view symbol atomic swap offers'
    network: 'mainnet|testnet'
    publicKey: '[0-9A-Fa-f]{64}'

symbol_atomic_swap.offer_edit:
  path: '/symbol-atomic-swap/offers/{offerId}/edit'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\SwapOfferForm'
    _title: 'Edit Swap Offer'
  requirements:
    _symbol_atomic_swap_offer_access: 'admin'
    offerId: '\d+'

symbol_atomic_swap.offer_accept:
  path: '/symbol-atomic-swap/offers/{offerId}/accept'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\SwapOfferAcceptForm'
    _title: 'Accept Swap Offer'
  requirements:
    _symbol_atomic_swap_offer_access: 'accept'
    offerId: '\d+'

symbol_atomic_swap.offer_submit_signed_payload:
  path: '/symbol-atomic-swap/offers/{offerId}/submit-signed-payload'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\SwapOfferSignedPayloadForm'
    _title: 'Submit Signed Payload'
  requirements:
    _symbol_atomic_swap_offer_access: 'operate'
    offerId: '\d+'

symbol_atomic_swap.offer_sign_with_sss:
  path: '/symbol-atomic-swap/offers/{offerId}/sign-with-sss'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\SwapOfferSssSignForm'
    _title: 'Sign with SSS'
  requirements:
    _symbol_atomic_swap_offer_access: 'operate'
    offerId: '\d+'

symbol_atomic_swap.offer_submit_aggregate_signer_json:
  path: '/symbol-atomic-swap/offers/{offerId}/submit-aggregate-signer-json'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\SwapOfferAggregateSignerJsonForm'
    _title: 'Submit Aggregate Signer JSON'
  requirements:
    _symbol_atomic_swap_offer_access: 'operate'
    offerId: '\d+'

symbol_atomic_swap.offer_submit_cosignature:
  path: '/symbol-atomic-swap/offers/{offerId}/submit-cosignature'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\SwapOfferCosignatureForm'
    _title: 'Submit Cosignature'
  requirements:
    _symbol_atomic_swap_offer_access: 'cosign'
    offerId: '\d+'

symbol_atomic_swap.offer_cosign_with_sss:
  path: '/symbol-atomic-swap/offers/{offerId}/cosign-with-sss'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\SwapOfferSssCosignForm'
    _title: 'Cosign with SSS'
  requirements:
    _symbol_atomic_swap_offer_access: 'cosign'
    offerId: '\d+'

symbol_atomic_swap.offer_assemble_signed_payload:
  path: '/symbol-atomic-swap/offers/{offerId}/assemble-signed-payload'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\SwapOfferAssembleSignedPayloadForm'
    _title: 'Assemble Signed Payload'
  requirements:
    _symbol_atomic_swap_offer_access: 'operate'
    offerId: '\d+'

symbol_atomic_swap.offer_announce:
  path: '/symbol-atomic-swap/offers/{offerId}/announce'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\SwapOfferAnnounceForm'
    _title: 'Announce Transaction'
  requirements:
    _symbol_atomic_swap_offer_access: 'operate'
    offerId: '\d+'

symbol_atomic_swap.offer_sync_projection:
  path: '/symbol-atomic-swap/offers/{offerId}/sync-projection'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\SwapOfferSyncProjectionForm'
    _title: 'Sync Projection'
  requirements:
    _symbol_atomic_swap_offer_access: 'operate'
    offerId: '\d+'

symbol_atomic_swap.offer_delete:
  path: '/symbol-atomic-swap/offers/{offerId}/delete'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\SwapOfferDeleteForm'
    _title: 'Delete Swap Offer'
  requirements:
    _symbol_atomic_swap_offer_access: 'admin'
    offerId: '\d+'

symbol_atomic_swap.transaction_history:
  path: '/symbol-atomic-swap/transactions'
  defaults:
    _controller: '\Drupal\symbol_atomic_swap\Controller\TransactionHistoryController::list'
    _title: 'Swap Transactions'
  requirements:
    _permission: 'view symbol atomic swap offers'

symbol_atomic_swap.notification_list:
  path: '/symbol-atomic-swap/notifications'
  defaults:
    _controller: '\Drupal\symbol_atomic_swap\Controller\NotificationController::list'
    _title: 'Swap Notifications'
  requirements:
    _permission: 'view symbol atomic swap offers'

symbol_atomic_swap.notification_mark_read:
  path: '/symbol-atomic-swap/notifications/{notificationId}/mark-read'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\NotificationMarkReadForm'
    _title: 'Mark Notification Read'
  requirements:
    _symbol_atomic_swap_notification_access: 'mark_read'
    notificationId: '\d+'

symbol_atomic_swap.notification_mark_all_read:
  path: '/symbol-atomic-swap/notifications/mark-all-read'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\NotificationMarkAllReadForm'
    _title: 'Mark All Notifications Read'
  requirements:
    _symbol_atomic_swap_notification_access: 'mark_all_read'

symbol_atomic_swap.engine_network:
  path: '/symbol-atomic-swap/engine/network'
  defaults:
    _controller: '\Drupal\symbol_atomic_swap\Controller\EngineController::network'
    _title: 'Symbol Engine Network'
  requirements:
    _permission: 'access content'

symbol_atomic_swap.engine_intent:
  path: '/symbol-atomic-swap/engine/intent/{intentHash}'
  defaults:
    _controller: '\Drupal\symbol_atomic_swap\Controller\EngineController::intent'
    _title: 'Symbol Engine Intent'
  requirements:
    _permission: 'access content'
    intentHash: '[0-9A-Fa-f]{64}'

symbol_atomic_swap.engine_projection:
  path: '/symbol-atomic-swap/engine/projection/{network}/{transactionHash}'
  defaults:
    _controller: '\Drupal\symbol_atomic_swap\Controller\EngineController::projection'
    _title: 'Symbol Engine Projection'
  requirements:
    _permission: 'access content'
    network: 'mainnet|testnet'
    transactionHash: '[0-9A-Fa-f]{64}'

symbol_atomic_swap.engine_lookup:
  path: '/admin/config/services/symbol-atomic-swap/engine'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\EngineLookupForm'
    _title: 'Symbol Engine'
  requirements:
    _permission: 'administer site configuration'

symbol_atomic_swap.settings:
  path: '/admin/config/services/symbol-atomic-swap/settings'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\SymbolAtomicSwapSettingsForm'
    _title: 'Symbol Atomic Swap Settings'
  requirements:
    _permission: 'administer site configuration'

symbol_atomic_swap.engine_operations:
  path: '/admin/config/services/symbol-atomic-swap/engine/operations'
  defaults:
    _form: '\Drupal\symbol_atomic_swap\Form\EngineOperationsForm'
    _title: 'Symbol Engine Operations'
  requirements:
    _permission: 'administer site configuration'
