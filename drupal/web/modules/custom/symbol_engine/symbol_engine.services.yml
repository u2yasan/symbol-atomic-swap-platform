services:
  symbol_engine.client:
    class: Drupal\symbol_engine\Service\SymbolEngineClient
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@cache.default'

  symbol_engine.address_deriver:
    class: Drupal\symbol_engine\Service\SymbolAddressDeriver

  symbol_engine.account_public_key_resolver:
    class: Drupal\symbol_engine\Service\SymbolEngineAccountPublicKeyResolver
    arguments: ['@symbol_engine.client', '@symbol_engine.address_deriver', '@state']
