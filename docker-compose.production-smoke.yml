services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: drupal
      POSTGRES_USER: drupal
      POSTGRES_PASSWORD: drupal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  symbol-engine-production:
    build:
      context: ./symbol-engine
      target: production
    environment:
      NODE_ENV: production
      SYMBOL_ENGINE_PORT: 3000
      SYMBOL_ENGINE_API_TOKEN: f3b9c1a84e7d42fa9c05b8d63e2a71cb
      SYMBOL_ENGINE_DATABASE_URL: postgresql://drupal:drupal@postgres:5432/drupal
      SYMBOL_ENGINE_LISTENER_ENABLED: "false"
      SYMBOL_ENGINE_RECONCILER_ENABLED: "false"
      SYMBOL_NETWORK: testnet
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
