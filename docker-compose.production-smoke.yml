services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: drupal
      POSTGRES_USER: drupal
      POSTGRES_PASSWORD: drupal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  symbol-engine-production:
    build:
      context: ./symbol-engine
      target: production
    environment:
      NODE_ENV: production
      SYMBOL_ENGINE_PORT: 3000
      SYMBOL_ENGINE_API_TOKEN: 0123456789abcdef0123456789abcdef
      SYMBOL_ENGINE_DATABASE_URL: postgresql://drupal:drupal@postgres:5432/drupal
      SYMBOL_ENGINE_LISTENER_ENABLED: "false"
      SYMBOL_ENGINE_RECONCILER_ENABLED: "false"
      SYMBOL_NETWORK: testnet
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('node:http'); const req = http.get({ host: '127.0.0.1', port: 3000, path: '/health', timeout: 3000 }, (res) => process.exit(res.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1)); req.on('timeout', () => req.destroy());"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
