services:
  postgres:
    image: postgres:16@sha256:5d143123fdf80462d1778cd4f24b9f7ca13c87174bca19141fb194c5a1ebca59
    environment:
      POSTGRES_DB: drupal
      POSTGRES_USER: drupal
      POSTGRES_PASSWORD: drupal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  symbol-engine-production:
    build:
      context: ./symbol-engine
      target: production
    environment:
      NODE_ENV: production
      SYMBOL_ENGINE_PORT: 3000
      SYMBOL_ENGINE_API_TOKEN: ${SYMBOL_ENGINE_API_TOKEN:?SYMBOL_ENGINE_API_TOKEN must be set}
      SYMBOL_ENGINE_DATABASE_URL: postgresql://drupal:drupal@postgres:5432/drupal
      SYMBOL_ENGINE_LISTENER_ENABLED: "false"
      SYMBOL_ENGINE_RECONCILER_ENABLED: "false"
      SYMBOL_ENGINE_EXPOSE_NODE_ENDPOINTS: "false"
      SYMBOL_NODE_REQUEST_TIMEOUT_MS: 10000
      SYMBOL_NETWORK: testnet
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
