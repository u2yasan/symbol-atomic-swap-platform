services:
  postgres:
    image: postgres:16@sha256:5d143123fdf80462d1778cd4f24b9f7ca13c87174bca19141fb194c5a1ebca59
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drupal}
      POSTGRES_USER: ${POSTGRES_USER:-drupal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drupal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  drupal:
    build:
      context: .
      dockerfile: infrastructure/docker/drupal/Dockerfile
    environment:
      SYMBOL_ENGINE_BASE_URL: http://symbol-engine:3000
      SYMBOL_ENGINE_API_TOKEN: ${SYMBOL_ENGINE_API_TOKEN}
      SYMBOL_ENGINE_TIMEOUT: ${SYMBOL_ENGINE_TIMEOUT:-10}
    depends_on:
      postgres:
        condition: service_healthy
      symbol-engine:
        condition: service_healthy
    ports:
      - "${DRUPAL_BIND_ADDRESS:-127.0.0.1}:${DRUPAL_PORT:-8080}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777
      - /opt/drupal/.phpunit.cache:uid=33,gid=33,mode=0770
      - /var/run/apache2:uid=33,gid=33,mode=0755
      - /var/lock/apache2:uid=33,gid=33,mode=0755
    volumes:
      - ./drupal/composer.json:/opt/drupal/composer.json
      - ./drupal/composer.lock:/opt/drupal/composer.lock
      - ./drupal/phpunit.xml.dist:/opt/drupal/phpunit.xml.dist
      - ./drupal/vendor:/opt/drupal/vendor
      - ./drupal/web:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "$$status = @file_get_contents('http://127.0.0.1:8080/symbol-atomic-swap/health'); exit($$status === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  symbol-engine:
    build:
      context: ./symbol-engine
      target: development
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SYMBOL_ENGINE_PORT: ${SYMBOL_ENGINE_PORT:-3000}
      SYMBOL_ENGINE_API_TOKEN: ${SYMBOL_ENGINE_API_TOKEN}
      SYMBOL_ENGINE_RATE_LIMIT_MAX: ${SYMBOL_ENGINE_RATE_LIMIT_MAX:-120}
      SYMBOL_ENGINE_DATABASE_URL: ${SYMBOL_ENGINE_DATABASE_URL:-postgresql://drupal:drupal@postgres:5432/drupal}
      SYMBOL_ENGINE_LISTENER_ENABLED: ${SYMBOL_ENGINE_LISTENER_ENABLED:-false}
      SYMBOL_ENGINE_LISTENER_ADDRESSES: ${SYMBOL_ENGINE_LISTENER_ADDRESSES:-}
      SYMBOL_ENGINE_RECONCILER_ENABLED: ${SYMBOL_ENGINE_RECONCILER_ENABLED:-false}
      SYMBOL_ENGINE_RECONCILER_INTERVAL_MS: ${SYMBOL_ENGINE_RECONCILER_INTERVAL_MS:-30000}
      SYMBOL_ENGINE_EXPOSE_NODE_ENDPOINTS: ${SYMBOL_ENGINE_EXPOSE_NODE_ENDPOINTS:-false}
      SYMBOL_NODE_REQUEST_TIMEOUT_MS: ${SYMBOL_NODE_REQUEST_TIMEOUT_MS:-10000}
      SYMBOL_NETWORK: ${SYMBOL_NETWORK:-testnet}
      SYMBOL_NETWORK_PROFILES_JSON: ${SYMBOL_NETWORK_PROFILES_JSON:-}
      SYMBOL_NODE_URL: ${SYMBOL_NODE_URL}
      SYMBOL_WS_URL: ${SYMBOL_WS_URL}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SYMBOL_ENGINE_BIND_ADDRESS:-127.0.0.1}:${SYMBOL_ENGINE_PORT:-3000}:3000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - ./symbol-engine:/app
      - symbol_engine_node_modules:/app/node_modules
    command: npm run dev
    user: node
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('node:http'); const port = process.env.SYMBOL_ENGINE_PORT || 3000; const req = http.get({ host: '127.0.0.1', port, path: '/health', timeout: 3000 }, (res) => process.exit(res.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1)); req.on('timeout', () => req.destroy());"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  symbol_engine_node_modules:
